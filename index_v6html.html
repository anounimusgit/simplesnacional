<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta Simples Nacional</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F2F1ED; --surface: #FFFFFF; --border: #E0DDD4;
    --border-strong: #BDB9AA; --text: #18170F; --text-muted: #706D60;
    --accent: #1B4332; --accent-light: #D1EAD8;
    --red: #821818; --red-light: #FCEAEA;
    --blue: #18365A; --blue-light: #DDE8F4;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 2.5rem 1.5rem;
  }
  .wrap { max-width: 660px; margin: 0 auto; }

  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 5px; }
  .header p { font-size: 13px; color: var(--text-muted); }
  .badge-free {
    display: inline-block; margin-left: 10px;
    background: var(--accent-light); color: var(--accent);
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 99px; vertical-align: middle; letter-spacing: 0.3px;
  }

  .status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 8px; margin-bottom: 1.5rem;
    font-size: 13px; border: 1px solid;
  }
  .status-bar.ok { background: var(--accent-light); border-color: #8FCCA0; color: var(--accent); }
  .status-bar.err { background: var(--red-light); border-color: #F0A0A0; color: var(--red); }
  .status-bar.checking { background: #FFF8E1; border-color: #F0D060; color: #7A5800; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .dot.pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .tabs { display: flex; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tab { flex: 1; padding: 10px 16px; font-size: 13px; font-family: var(--sans); color: var(--text-muted); cursor: pointer; background: transparent; border: none; border-right: 1px solid var(--border); transition: all 0.15s; }
  .tab:last-child { border-right: none; }
  .tab.active { background: var(--surface); color: var(--text); font-weight: 500; }
  .tab:hover:not(.active) { background: rgba(0,0,0,0.03); }

  .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .input-row input {
    flex: 1; height: 46px; padding: 0 14px;
    border: 1px solid var(--border-strong); border-radius: 8px;
    font-family: var(--mono); font-size: 15px;
    background: var(--surface); color: var(--text); outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(27,67,50,0.08); }

  .btn {
    height: 46px; padding: 0 22px;
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { background: #0f2d21; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  textarea {
    width: 100%; height: 120px; padding: 12px 14px;
    border: 1px solid var(--border-strong); border-radius: 8px;
    font-family: var(--mono); font-size: 13px; line-height: 1.75;
    background: var(--surface); color: var(--text);
    resize: vertical; outline: none; margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }
  .bulk-btn-row { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }

  .progress-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s; }

  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .results-count { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
  .clear-btn { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
  .clear-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .export-btn { font-size: 12px; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; margin-right: 8px; }
  .export-btn:hover { background: #0f2d21; }
  .results-actions { display: flex; align-items: center; gap: 6px; }

  .error-summary {
    background: var(--red-light); border: 1px solid #ECAAAA;
    border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 14px;
    color: var(--red);
  }
  .error-summary-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .error-summary-list { font-family: var(--mono); font-size: 12px; line-height: 1.7; padding-left: 18px; }
  .error-summary-list li { margin-bottom: 3px; }
  .error-summary small { color: var(--red); opacity: .85; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 10px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .card.error { border-color: #ECAAAA; background: var(--red-light); }

  .cnpj-tag { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.6px; margin-bottom: 5px; text-transform: uppercase; }
  .card.error .cnpj-tag { color: var(--red); }
  .company-name { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
  .error-msg { font-size: 13px; color: var(--red); line-height: 1.5; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .badge.sim { background: var(--accent-light); color: var(--accent); }
  .badge.nao { background: var(--red-light); color: var(--red); }
  .badge.mei { background: var(--blue-light); color: var(--blue); }

  .meta { font-size: 12px; color: var(--text-muted); line-height: 1.9; font-family: var(--mono); }
  .meta strong { color: var(--text); font-weight: 500; }

  .skel { height: 13px; border-radius: 4px; background: var(--bg); margin-bottom: 8px; animation: shimmer 1.2s ease-in-out infinite; }
  .skel.w70 { width: 70%; } .skel.w40 { width: 40%; }
  @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.25} }

  .footer { margin-top: 2rem; font-size: 12px; color: var(--text-muted); line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Consulta Simples Nacional <span class="badge-free">GRATUITO</span></h1>
    <p>Consulta direta no navegador · CNPJá Open + BrasilAPI · Sem custos</p>
  </div>

  <div class="status-bar checking" id="status">
    <span class="dot pulse"></span>
    <span id="status-text">Aplicação pronta para consultar...</span>
  </div>

  <div class="status-bar ok" style="background:#fff;border-color:var(--border);color:var(--text-muted)">
    <span class="dot"></span>
    <span>Para publicar, salve este arquivo como <strong>index.html</strong> no GitHub Pages.</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('ind')">CNPJ individual</button>
    <button class="tab" onclick="switchTab('bulk')">Consulta em lote</button>
  </div>

  <div id="panel-ind">
    <div class="input-row">
      <input type="text" id="cnpj-input" placeholder="00.000.000/0001-00" maxlength="18"
        oninput="maskCNPJ(this)" onkeydown="if(event.key==='Enter')consultarUm()" />
      <button class="btn" id="btn-ind" onclick="consultarUm()">Consultar</button>
    </div>
  </div>

  <div id="panel-bulk" style="display:none">
    <textarea id="cnpj-bulk" placeholder="Um CNPJ por linha (ou separados por vírgula/ponto e vírgula):&#10;10.878.351/0001-53&#10;61.636.711/0001-41&#10;33.000.167/0001-01"></textarea>
    <div class="bulk-btn-row">
      <button class="btn" id="btn-bulk" onclick="consultarLote()">Consultar todos</button>
    </div>
  </div>

  <div id="progress-wrap" class="progress-wrap" style="display:none">
    <div class="progress-bar" id="pbar" style="width:0%"></div>
  </div>

  <div id="results"></div>

  <div class="footer">
    Versão web estática para GitHub Pages · Dados públicos via APIs abertas
  </div>
</div>

<script>
const API_CNPJA = 'https://open.cnpja.com/office/';
const API_BRASIL = 'https://brasilapi.com.br/api/cnpj/v1/';
const API_CNPJWS = 'https://publica.cnpj.ws/cnpj/';
const API_MINHARECEITA = 'https://minhareceita.org/';
const results = [];

async function checkServer() {
  const st = document.getElementById('status');
  const tx = document.getElementById('status-text');
  st.className = 'status-bar ok';
  st.querySelector('.dot').classList.remove('pulse');
  tx.textContent = 'Aplicação pronta — consulta direta em múltiplas APIs públicas';
  return true;
}

function switchTab(t) {
  ['ind','bulk'].forEach(id => {
    document.querySelector(`[onclick="switchTab('${id}')"]`).classList.toggle('active', id===t);
    document.getElementById('panel-'+id).style.display = id===t ? '' : 'none';
  });
}

function maskCNPJ(el) {
  let v = el.value.replace(/\D/g,'').slice(0,14);
  if(v.length>12) v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,'$1.$2.$3/$4-$5');
  else if(v.length>8) v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/,'$1.$2.$3/$4');
  else if(v.length>5) v=v.replace(/^(\d{2})(\d{3})(\d{0,3}).*/,'$1.$2.$3');
  else if(v.length>2) v=v.replace(/^(\d{2})(\d{0,3}).*/,'$1.$2');
  el.value=v;
}

function clean(s){ return String(s || '').replace(/\D/g,''); }
function fmtCNPJ(s){ const c=clean(s).padStart(14,'0'); return `${c.slice(0,2)}.${c.slice(2,5)}.${c.slice(5,8)}/${c.slice(8,12)}-${c.slice(12,14)}`; }

function fmtDate(d){
  if(!d) return '';
  d = String(d);

  // Aceita formato YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(d)){
    const [y,m,day] = d.slice(0,10).split('-');
    return `${day}/${m}/${y}`;
  }

  // Aceita formato DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}/.test(d)){
    return d.slice(0,10);
  }

  return d;
}

function limpar(){ results.length=0; renderAll(); }

function textoCompleto(obj){
  return JSON.stringify(obj || {}, null, 2);
}

function pick(...vals){
  for(const v of vals){
    if(v !== undefined && v !== null && String(v).trim() !== '') return v;
  }
  return '';
}

function boolLike(v){
  if(v === true) return true;
  if(v === false) return false;
  if(v === 1 || v === '1') return true;
  if(v === 0 || v === '0') return false;
  const s = String(v || '').toLowerCase();
  if(['sim','s','yes','true','optante','ativo','ativa'].includes(s)) return true;
  if(['nao','não','n','no','false','nao_optante','não optante'].includes(s)) return false;
  return null;
}

function getInfoSimples(r){
  const textoOriginal = textoCompleto(r);
  const texto = textoOriginal.toLowerCase();

  let desde = pick(
    r.simples?.date_opted_in, r.simples?.since, r.simples?.since_date, r.simples?.data_opcao, r.simples?.dataOpcao,
    r.simples_nacional?.date_opted_in, r.simples_nacional?.since, r.simples_nacional?.data_opcao, r.simples_nacional?.dataOpcao,
    r.simplesNacional?.date_opted_in, r.simplesNacional?.since, r.simplesNacional?.data_opcao, r.simplesNacional?.dataOpcao,
    r.data_opcao_simples, r.data_opcao_pelo_simples, r.simples_desde
  );
  if(!desde){
    const match = textoOriginal.match(/Optante pelo Simples Nacional desde\s+(\d{2}\/\d{2}\/\d{4}|\d{4}-\d{2}-\d{2})/i);
    if(match) desde = match[1];
  }

  const flags = [
    r.simples?.optante, r.simples?.optant, r.simples?.is_optant, r.simples?.isOptant,
    r.simples_nacional?.optante, r.simples_nacional?.optant,
    r.simplesNacional?.optante, r.simplesNacional?.optant,
    r.optante_simples, r.simples_optante, r.is_simples, r.isSimples,
    r.regime_tributario, r.tax_regime, r.taxRegime
  ];
  let optante = false;
  for(const f of flags){ if(boolLike(f) === true) optante = true; }

  // Correção: se a API trouxe data de opção, considerar como optante.
  if(desde) optante = true;

  if(!optante){
    optante = texto.includes('optante pelo simples nacional') ||
              texto.includes('situação no simples nacional: optante') ||
              texto.includes('situacao no simples nacional: optante') ||
              texto.includes('simples nacional desde');
  }
  return { optante, desde };
}


function csvCell(value){
  const s = String(value ?? '').replace(/\r?\n|\r/g, ' ').trim();
  return '"' + s.replace(/"/g, '""') + '"';
}

function baixarArquivo(nome, conteudo, mime){
  const blob = new Blob([conteudo], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCSV(){
  const finalizados = results.filter(r => !r.loading);
  if(!finalizados.length){
    alert('Nenhum resultado para exportar');
    return;
  }

  const header = [
    'Status Consulta', 'Erro', 'CNPJ', 'Razao Social', 'Simples Nacional', 'Simples Desde', 'MEI/SIMEI', 'MEI Desde',
    'Situacao', 'Municipio', 'UF', 'CNAE', 'Fonte'
  ];

  const linhas = [header.map(csvCell).join(';')];

  for(const r of finalizados){
    if(r.error){
      const rowErro = [
        'Erro',
        r.error || '',
        fmtCNPJ(r.cnpj || ''),
        '', '', '', '', '', '', '', '', '', ''
      ];
      linhas.push(rowErro.map(csvCell).join(';'));
      continue;
    }

    const simplesInfo = getInfoSimples(r);
    const meiDesde = pick(r.simei?.date_opted_in, r.simei?.since, r.simei?.data_opcao);
    const isMEI = boolLike(r.simei?.optante) === true || boolLike(r.simei?.optant) === true || r.mei === true || r.optante_mei === true;
    const situacao = pick(r.descricao_situacao_cadastral, r.status?.text, r.status?.name);
    const municipio = pick(r.municipio, r.address?.city, r.endereco?.municipio);
    const uf = pick(r.uf, r.address?.state, r.endereco?.uf);
    const cnae = pick(r.cnae_fiscal_descricao, r.mainActivity?.text, r.main_activity?.text, r.atividade_principal?.[0]?.text);
    const nome = pick(r.razao_social, r.company?.name, r.name, r.nome);
    const cnpjView = pick(r.cnpj, r.taxId);

    const row = [
      'Ok',
      '',
      fmtCNPJ(cnpjView || ''),
      nome || '',
      simplesInfo.optante ? 'Sim' : 'Não',
      fmtDate(simplesInfo.desde || ''),
      isMEI ? 'Sim' : 'Não',
      fmtDate(meiDesde || ''),
      situacao || '',
      municipio || '',
      uf || '',
      cnae || '',
      r._fonte || ''
    ];
    linhas.push(row.map(csvCell).join(';'));
  }

  const agora = new Date();
  const stamp = agora.toISOString().slice(0,19).replace(/[-:T]/g,'');
  baixarArquivo(`consulta_simples_${stamp}.csv`, '\ufeff' + linhas.join('\n'), 'text/csv;charset=utf-8;');
}

function renderAll(){
  const el=document.getElementById('results');
  if(!results.length){el.innerHTML='';return;}

  const erros = results.filter(r => !r.loading && r.error);
  let html=`<div class="results-header"><span class="results-count">${results.length} resultado(s) · ${erros.length} erro(s)</span><div class="results-actions"><button class="export-btn" onclick="exportCSV()">Exportar CSV</button><button class="clear-btn" onclick="limpar()">Limpar</button></div></div>`;

  if(erros.length){
    html += `<div class="error-summary">
      <div class="error-summary-title">CNPJs com erro (${erros.length})</div>
      <ol class="error-summary-list">`;
    for(const e of erros){
      html += `<li><strong>${fmtCNPJ(e.cnpj || '')}</strong> — <small>${e.error || 'Erro não identificado'}</small></li>`;
    }
    html += `</ol></div>`;
  }

  for(const r of results){
    if(r.loading){
      html+=`<div class="card"><div class="cnpj-tag">${r.cnpj}</div><div class="skel w70"></div><div class="skel w40"></div></div>`;
    } else if(r.error){
      html+=`<div class="card error"><div class="cnpj-tag">${fmtCNPJ(r.cnpj || '')}</div><div class="error-msg">${r.error}</div></div>`;
    } else {
      const simplesInfo = getInfoSimples(r);
      const isSimples = simplesInfo.optante === true;
      const isMEI = boolLike(r.simei?.optante) === true || boolLike(r.simei?.optant) === true || r.mei === true || r.optante_mei === true;
      const nao = !isSimples && !isMEI;

      let badges = '';
      if(isSimples) badges += `<span class="badge sim">✓ Simples Nacional</span>`;
      if(isMEI) badges += `<span class="badge mei">✓ MEI / SIMEI</span>`;
      if(nao) badges += `<span class="badge nao">✗ Não optante</span>`;

      let meta = '';
      if(simplesInfo.desde){
        meta += `Simples desde: <strong>${fmtDate(simplesInfo.desde)}</strong><br>`;
      }
      const meiDesde = pick(r.simei?.date_opted_in, r.simei?.since, r.simei?.data_opcao);
      if(meiDesde){
        meta += `MEI desde: <strong>${fmtDate(meiDesde)}</strong><br>`;
      }
      const situacao = pick(r.descricao_situacao_cadastral, r.status?.text, r.status?.name);
      const municipio = pick(r.municipio, r.address?.city, r.endereco?.municipio);
      const uf = pick(r.uf, r.address?.state, r.endereco?.uf);
      const cnae = pick(r.cnae_fiscal_descricao, r.mainActivity?.text, r.main_activity?.text, r.atividade_principal?.[0]?.text);
      const nome = pick(r.razao_social, r.company?.name, r.name, r.nome);
      const cnpjView = pick(r.cnpj, r.taxId);
      if(situacao) meta+=`Situação: <strong>${situacao}</strong>`;
      if(municipio) meta+=`<br>Município: <strong>${municipio} / ${uf||''}</strong>`;
      if(cnae) meta+=`<br>CNAE: <strong>${cnae}</strong>`;
      if(r._fonte) meta+=`<br>Fonte: <strong>${r._fonte}</strong>`;
      html+=`<div class="card">
        <div class="cnpj-tag">${fmtCNPJ(cnpjView||'')}</div>
        <div class="company-name">${nome||'—'}</div>
        <div class="badges">${badges}</div>
        ${meta?`<div class="meta">${meta}</div>`:''}
      </div>`;
    }
  }
  el.innerHTML=html;
}


function normalizeCnpja(data, cnpj){
  data = data || {};
  const company = data.company || {};
  const status = data.status || {};
  const address = data.address || {};
  const mainActivity = data.mainActivity || data.main_activity || {};
  const simples = data.simples || data.simplesNacional || data.simples_nacional || {};
  const simei = data.simei || {};
  return {
    ...data,
    cnpj: pick(data.taxId, data.cnpj, cnpj),
    razao_social: pick(company.name, data.razao_social, data.name),
    descricao_situacao_cadastral: pick(status.text, status.name, data.descricao_situacao_cadastral),
    municipio: pick(address.city, data.municipio),
    uf: pick(address.state, data.uf),
    cnae_fiscal_descricao: pick(mainActivity.text, data.cnae_fiscal_descricao),
    simples,
    simei,
    _fonte: 'CNPJá Open'
  };
}

function normalizeCnpjWs(data, cnpj){
  data = data || {};
  const est = data.estabelecimento || data;
  const cidade = est.cidade || {};
  const estado = est.estado || {};
  const atividade = est.atividade_principal || {};
  const simplesObj = data.simples || est.simples || {};
  return {
    ...data,
    cnpj: pick(est.cnpj, data.cnpj, cnpj),
    razao_social: pick(data.razao_social, est.nome_fantasia, data.nome_fantasia),
    descricao_situacao_cadastral: pick(est.situacao_cadastral, data.descricao_situacao_cadastral),
    municipio: pick(cidade.nome, est.municipio, data.municipio),
    uf: pick(estado.sigla, est.uf, data.uf),
    cnae_fiscal_descricao: pick(atividade.descricao, data.cnae_fiscal_descricao),
    simples: {
      ...simplesObj,
      optante: pick(simplesObj.simples, simplesObj.optante, simplesObj.optant),
      data_opcao: pick(simplesObj.data_opcao_simples, simplesObj.data_opcao, simplesObj.since)
    },
    simei: {
      optante: pick(simplesObj.mei, simplesObj.simei, simplesObj.optante_mei),
      data_opcao: pick(simplesObj.data_opcao_mei, simplesObj.data_opcao_simei)
    },
    _fonte: 'CNPJ.ws'
  };
}

function normalizeMinhaReceita(data, cnpj){
  data = data || {};
  return {
    ...data,
    cnpj: pick(data.cnpj, cnpj),
    razao_social: pick(data.razao_social, data.nome, data.nome_fantasia),
    descricao_situacao_cadastral: pick(data.descricao_situacao_cadastral, data.situacao_cadastral),
    municipio: pick(data.municipio),
    uf: pick(data.uf),
    cnae_fiscal_descricao: pick(data.cnae_fiscal_descricao, data.cnae_descricao),
    simples: data.simples || data.simples_nacional || {},
    simei: data.simei || {},
    _fonte: 'Minha Receita'
  };
}

function mergeMissing(base, extra){
  base = base || {};
  extra = extra || {};
  for(const [key, value] of Object.entries(extra)){
    const atual = base[key];
    const vazio = atual === undefined || atual === null || atual === '' ||
                  (Array.isArray(atual) && atual.length === 0) ||
                  (typeof atual === 'object' && !Array.isArray(atual) && Object.keys(atual).length === 0);
    if(vazio) base[key] = value;
  }
  return base;
}

async function fetchJson(url, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 20000);
  try{
    const res = await fetch(url, {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      cache: 'no-store',
      signal: controller.signal
    });
    let data = {};
    try { data = await res.json(); } catch(e) {}
    if(!res.ok){
      const msg = data.message || data.error || `Erro HTTP ${res.status}`;
      throw new Error(msg);
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function tentarApi(nome, url, normalizador, cnpj, timeoutMs){
  try{
    const raw = await fetchJson(url, timeoutMs);
    return normalizador(raw, cnpj);
  } catch(e){
    return { _erro_api: nome + ': ' + (e.message || e.name || 'falhou') };
  }
}

async function consultarApisPublicas(cnpj){
  const tentativas = [
    ['CNPJá Open', API_CNPJA + cnpj, normalizeCnpja, 20000],
    ['BrasilAPI', API_BRASIL + cnpj, normalizeMinhaReceita, 15000],
    ['CNPJ.ws', API_CNPJWS + cnpj, normalizeCnpjWs, 15000],
    ['Minha Receita', API_MINHARECEITA + cnpj, normalizeMinhaReceita, 15000],
  ];

  let data = null;
  const erros = [];

  for(const [nome, url, normalizador, timeout] of tentativas){
    const resp = await tentarApi(nome, url, normalizador, cnpj, timeout);
    if(resp && !resp._erro_api){
      if(!data){
        data = resp;
      } else {
        const fonteAntes = data._fonte || '';
        data = mergeMissing(data, resp);
        const fontes = [fonteAntes, resp._fonte].filter(Boolean).join(' + ');
        data._fonte = [...new Set(fontes.split(' + '))].join(' + ');
      }
      const info = getInfoSimples(data);
      if((data.razao_social || data.company?.name || data.nome) && info.optante){
        break;
      }
    } else if(resp?._erro_api){
      erros.push(resp._erro_api);
    }
    await new Promise(res => setTimeout(res, 250));
  }

  if(!data){
    throw new Error(`CNPJ ${fmtCNPJ(cnpj)} não encontrado nas bases públicas testadas. Detalhes: ${erros.join(' | ')}`);
  }

  return data;
}

async function fetchCNPJ(cnpj) {
  const c = clean(cnpj);
  if(c.length!==14) throw new Error('CNPJ inválido');
  return await consultarApisPublicas(c);
}

async function consultarUm(){
  const raw=document.getElementById('cnpj-input').value.trim();
  if(!raw)return;
  const c=clean(raw);
  if(c.length!==14){alert('CNPJ inválido (14 dígitos necessários)');return;}
  const btn=document.getElementById('btn-ind');
  btn.disabled=true; btn.textContent='Consultando...';
  results.unshift({cnpj:fmtCNPJ(c),loading:true});
  renderAll();
  try{ const r=await fetchCNPJ(c); results[0]=r; }
  catch(e){ results[0]={cnpj:c, error:e.message}; }
  btn.disabled=false; btn.textContent='Consultar';
  renderAll();
}

async function consultarLote(){
  const raw=document.getElementById('cnpj-bulk').value;
  const list=[...new Set(raw.split(/[\n,;]+/).map(s=>clean(s.trim())).filter(s=>s.length===14))];
  if(!list.length){alert('Nenhum CNPJ válido encontrado');return;}
  const btn=document.getElementById('btn-bulk');
  btn.disabled=true; btn.textContent=`Consultando 0/${list.length}...`;
  results.length=0;
  list.forEach(c=>results.push({cnpj:fmtCNPJ(c),loading:true}));
  const pw=document.getElementById('progress-wrap'), pb=document.getElementById('pbar');
  pw.style.display=''; pb.style.width='0%';
  renderAll();
  for(let i=0;i<list.length;i++){
    try{ const r=await fetchCNPJ(list[i]); results[i]=r; }
    catch(e){ results[i]={cnpj:list[i], error:e.message}; }
    pb.style.width=`${Math.round((i+1)/list.length*100)}%`;
    btn.textContent=`Consultando ${i+1}/${list.length}...`;
    renderAll();
    if(i<list.length-1) await new Promise(res=>setTimeout(res,900));
  }
  setTimeout(()=>{pw.style.display='none';},1000);
  btn.disabled=false; btn.textContent='Consultar todos';
}
